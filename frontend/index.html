<!doctype html>
<html lang="uz" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Brauzer tarjimasi React matnini almashtirib sahifani yiqitardi ("insertBefore",
         2026-09-25 jurnalida 21 marta). Ilovaning o'z uz/ru/en tillari bor. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5fa4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/imentor-logo.png" />
    <link rel="icon" type="image/png" href="/imentor-logo.png" />
    <title>iMentor</title>
  </head>
  <body>
    <div id="root">
      <div style="padding:24px;font:16px system-ui,sans-serif;color:#172033">
        <p id="imentor-boot-status" role="status">iMentor yuklanmoqda…</p>
        <p id="imentor-boot-retry" hidden>
          Havolani Safari yoki Chrome’da oching yoki <a href="" onclick="window.location.reload(); return false;">qayta urinib ko‘ring</a>.
        </p>
        <noscript>Testni ochish uchun brauzerda JavaScript yoqilgan bo‘lishi kerak.</noscript>
      </div>
    </div>
    <script>
      (function () {
        function showRetry() {
          var status = document.getElementById('imentor-boot-status');
          var retry = document.getElementById('imentor-boot-retry');
          if (!status || !retry) return;
          status.textContent = 'Sahifa yuklanishi yakunlanmadi.';
          retry.hidden = false;
        }
        window.addEventListener('error', showRetry, true);
        window.addEventListener('unhandledrejection', showRetry);
        window.setTimeout(showRetry, 12000);
      }());
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
